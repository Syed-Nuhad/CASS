<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Driver App - CASS</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#191970',
                        accent: '#38bdf8',
                        surface: 'rgba(255, 255, 255, 0.85)',
                        'brand-bg': '#ECEFF1',
                    },
                    borderRadius: {
                        '3xl': '24px',
                    }
                }
            }
        }
    </script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (for JSX) -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    
    <link rel="stylesheet" href="{% static 'css/react_driver.css' %}">
</head>
<body class="overflow-x-hidden antialiased text-[#0D0907]">
    <!-- Initial Data passed from Django securely -->
    <script>
        window.INITIAL_DATA = {{ initial_data_json|safe }};
        window.CSRF_TOKEN = "{{ csrf_token_value }}";
        axios.defaults.headers.common['X-CSRFToken'] = window.CSRF_TOKEN;
    </script>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const data = window.INITIAL_DATA;
            const [view, setView] = useState('list');
            const [selectedOrder, setSelectedOrder] = useState(null);
            const [width, setWidth] = useState(window.innerWidth);

            // Responsive width tracking
            useEffect(() => {
                const handleResize = () => setWidth(window.innerWidth);
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const isDesktop = width >= 1024;

            // Auto-select first order on desktop if none selected
            useEffect(() => {
                if (isDesktop && !selectedOrder && data.active_requests.length > 0) {
                    setSelectedOrder(data.active_requests[0]);
                }
            }, [isDesktop, data.active_requests, selectedOrder]);

            const handleOrderClick = (order) => {
                setSelectedOrder(order);
                if (!isDesktop) {
                    setView('detail');
                }
            };

            const handleBack = () => {
                if (!isDesktop) {
                    setSelectedOrder(null);
                    setView('list');
                }
            };

            if (isDesktop) {
                // Desktop Dual Column Layout
                const forwarded = data.active_requests.filter(r => r.status_raw === 'FORWARDED');
                const onTheWay = data.active_requests.filter(r => r.status_raw === 'ON_THE_WAY');

                return (
                    <div className="flex h-screen overflow-hidden p-6 gap-6 max-w-7xl mx-auto">
                        {/* Left Sidebar Panel - Scrollable List */}
                        <div className="w-[420px] shrink-0 flex flex-col glass-card rounded-[32px] p-6 overflow-hidden">
                            {/* Brand Header */}
                            <div className="flex items-center gap-4 mb-6 border-b border-black/5 pb-5">
                                <img src={data.user.logo_url} alt="CASS Logo" className="h-12 w-12 object-contain" />
                                <div>
                                    <h1 className="text-xl font-extrabold text-[#191970] leading-tight">CASS Portal</h1>
                                    <p className="text-xs font-semibold text-[#64748b] tracking-wider uppercase">Delivery Logistics</p>
                                </div>
                            </div>

                            {/* User Welcome */}
                            <div className="flex items-center justify-between bg-[#191970]/5 p-4 rounded-2xl mb-6">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 rounded-full bg-[#191970] text-white flex items-center justify-center font-bold text-lg">
                                        {data.user.username[0].toUpperCase()}
                                    </div>
                                    <div>
                                        <p className="text-xs text-[#64748b] font-medium">Active Driver</p>
                                        <h4 className="font-bold text-[#191970]">{data.user.username}</h4>
                                    </div>
                                </div>
                                <button 
                                    onClick={() => window.location.href='/logout/'}
                                    className="p-2 rounded-xl bg-white hover:bg-red-50 text-[#64748b] hover:text-red-500 border border-black/5 transition-all"
                                    title="Logout"
                                >
                                    <i className="fa-solid fa-arrow-right-from-bracket"></i>
                                </button>
                            </div>

                            {/* Overview Statistics Cards */}
                            <div className="grid grid-cols-2 gap-3 mb-6">
                                <div className="bg-[#191970]/5 border border-[#191970]/10 rounded-2xl p-4 shadow-sm">
                                    <p className="text-[#191970] text-[11px] font-bold uppercase tracking-wider">Available</p>
                                    <p className="text-2xl font-extrabold mt-1 text-[#191970]">{forwarded.length}</p>
                                    <p className="text-[10px] text-[#191970]/60 font-medium mt-0.5">Pending Jobs</p>
                                </div>
                                <div className="bg-[#191970]/5 border border-[#191970]/10 rounded-2xl p-4 shadow-sm">
                                    <p className="text-[#191970] text-[11px] font-bold uppercase tracking-wider">Claimed</p>
                                    <p className="text-2xl font-extrabold mt-1 text-[#191970]">{onTheWay.length}</p>
                                    <p className="text-[10px] text-[#191970]/60 font-medium mt-0.5">In Progress</p>
                                </div>
                            </div>

                            {/* Scrollable Job List */}
                            <div className="flex-1 overflow-y-auto premium-scroll pr-1 space-y-4">
                                {/* Claims / In Progress */}
                                {onTheWay.length > 0 && (
                                    <div>
                                        <h3 className="text-xs font-bold text-[#191970] uppercase tracking-wider mb-2 flex items-center gap-2">
                                            <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                                            Active Delivery
                                        </h3>
                                        <div className="space-y-3">
                                            {onTheWay.map(req => (
                                                <JobCard 
                                                    key={req.id} 
                                                    req={req} 
                                                    isSelected={selectedOrder && selectedOrder.id === req.id} 
                                                    onOrderClick={handleOrderClick} 
                                                />
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {/* Available Jobs */}
                                <div>
                                    <h3 className="text-xs font-bold text-[#64748b] uppercase tracking-wider mb-2 flex items-center gap-2">
                                        <i className="fa-solid fa-clipboard-list"></i>
                                        Available Jobs
                                    </h3>
                                    {forwarded.length === 0 ? (
                                        <div className="bg-black/5 rounded-2xl p-6 text-center border border-dashed border-black/10">
                                            <i className="fa-solid fa-circle-check text-2xl text-[#10b981] mb-2"></i>
                                            <p className="text-xs font-semibold text-[#191970]">No pending orders</p>
                                            <p className="text-[10px] text-[#64748b] mt-0.5">All jobs claimed or delivered</p>
                                        </div>
                                    ) : (
                                        <div className="space-y-3">
                                            {forwarded.map(req => (
                                                <JobCard 
                                                    key={req.id} 
                                                    req={req} 
                                                    isSelected={selectedOrder && selectedOrder.id === req.id} 
                                                    onOrderClick={handleOrderClick} 
                                                />
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* Right Content Panel - Selected Details View */}
                        <div className="flex-1 flex flex-col glass-card rounded-[32px] p-8 overflow-hidden">
                            {selectedOrder ? (
                                <DetailView order={selectedOrder} onBack={handleBack} isDesktop={true} />
                            ) : (
                                <div className="flex-1 flex flex-col items-center justify-center text-center">
                                    <div className="w-20 h-20 rounded-full bg-[#191970]/5 flex items-center justify-center text-[#191970] mb-4 animate-bounce">
                                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                                            <rect x="1" y="3" width="15" height="13" rx="2" ry="2" />
                                            <polygon points="16 8 20 8 23 11 23 16 16 16 16 8" />
                                            <circle cx="5.5" cy="18.5" r="2.5" />
                                            <circle cx="18.5" cy="18.5" r="2.5" />
                                        </svg>
                                    </div>
                                    <h2 className="text-2xl font-extrabold text-[#191970]">No Job Selected</h2>
                                    <p className="text-sm text-[#64748b] mt-1 max-w-sm">Select any job card from the sidebar list to review details and logistics actions.</p>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            // Mobile/Tablet Standard App Layout
            return (
                <div className="flex flex-col h-screen bg-transparent">
                    {view === 'list' && <ListView data={data} onOrderClick={handleOrderClick} />}
                    {view === 'detail' && <DetailView order={selectedOrder} onBack={handleBack} isDesktop={false} />}
                </div>
            );
        };

        const ListView = ({ data, onOrderClick }) => {
            const forwarded = data.active_requests.filter(r => r.status_raw === 'FORWARDED');
            const onTheWay = data.active_requests.filter(r => r.status_raw === 'ON_THE_WAY');

            return (
                <React.Fragment>
                    {/* Scrollable content */}
                    <div className="flex-1 overflow-y-auto pb-24 no-scrollbar">

                        {/* Hero Header Card */}
                        <div className="bg-white/80 backdrop-blur-md px-6 pt-12 pb-8 relative overflow-hidden rounded-b-[32px] border-b border-black/5 shadow-[0_8px_30px_rgba(25,25,112,0.02)]">
                            <div className="absolute top-0 right-0 -mr-10 -mt-10 w-40 h-40 rounded-full bg-[#191970]/5"></div>
                            <div className="absolute bottom-0 left-0 -ml-10 -mb-10 w-28 h-28 rounded-full bg-[#191970]/5"></div>

                            <div className="flex items-center gap-3 mb-4">
                                <img src={data.user.logo_url} alt="CASS Logo" className="h-8 w-8 object-contain" />
                                <span className="text-[#191970]/70 text-sm font-bold tracking-widest uppercase">CASS DRIVER</span>
                            </div>
                            
                            <p className="text-[#191970]/60 text-xs font-bold tracking-wide mb-1 uppercase">Welcome Back</p>
                            <h1 className="text-2xl font-black text-[#191970]">{data.user.username}</h1>

                            <div className="mt-6 flex gap-3 relative z-10">
                                <div className="bg-[#191970]/5 border border-[#191970]/10 rounded-2xl px-4 py-3 flex-1">
                                    <p className="text-[#191970] text-xs font-bold uppercase tracking-wider mb-0.5">Available</p>
                                    <p className="text-[#191970] font-extrabold text-xl">{forwarded.length}</p>
                                </div>
                                <div className="bg-[#191970]/5 border border-[#191970]/10 rounded-2xl px-4 py-3 flex-1">
                                    <p className="text-[#191970] text-xs font-bold uppercase tracking-wider mb-0.5">Claimed</p>
                                    <p className="text-[#191970] font-extrabold text-xl">{onTheWay.length}</p>
                                </div>
                            </div>
                        </div>

                        {/* Jobs List */}
                        <div className="px-4 pt-6">

                            {/* On The Way section */}
                            {onTheWay.length > 0 && (
                                <div className="mb-6">
                                    <div className="flex justify-between items-center mb-3 px-1">
                                        <h3 className="text-sm font-black text-[#191970] uppercase tracking-wider">My Active Delivery</h3>
                                        <span className="text-xs font-bold bg-[#191970] text-white px-2.5 py-0.5 rounded-full">{onTheWay.length}</span>
                                    </div>
                                    <div className="space-y-3">
                                        {onTheWay.map(req => (
                                            <JobCard key={req.id} req={req} onOrderClick={onOrderClick} />
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* Available Jobs section */}
                            <div className="flex justify-between items-center mb-3 px-1">
                                <h3 className="text-sm font-black text-[#64748b] uppercase tracking-wider">Available Jobs</h3>
                                {forwarded.length > 0 && <span className="text-xs font-bold bg-[#191970]/10 text-[#191970] px-2.5 py-0.5 rounded-full">{forwarded.length}</span>}
                            </div>

                            {forwarded.length === 0 ? (
                                <div className="glass-card rounded-2xl p-8 border border-dashed border-black/10 text-center flex flex-col items-center justify-center mt-2">
                                    <div className="w-14 h-14 bg-[#191970]/5 rounded-full flex items-center justify-center text-[#191970] text-xl mb-3">
                                        <i className="fa-solid fa-map-location-dot"></i>
                                    </div>
                                    <p className="text-[#191970] font-bold">No available jobs</p>
                                    <p className="text-xs text-[#64748b] mt-1">Waiting for dispatch to forward new orders.</p>
                                </div>
                            ) : (
                                <div className="space-y-3">
                                    {forwarded.map(req => (
                                        <JobCard key={req.id} req={req} onOrderClick={onOrderClick} />
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Mobile Bottom Navigation */}
                    <div className="fixed bottom-0 w-full bg-white/90 backdrop-blur-md border-t border-black/5 shadow-[0_-4px_25px_rgba(25,25,112,0.06)] z-20 pb-safe">
                        <div className="flex justify-around items-center h-16">
                            <button
                                onClick={() => window.location.href='/logout/'}
                                className="flex flex-col items-center justify-center w-24 h-full text-[#64748b] hover:text-red-500 transition-colors"
                            >
                                <i className="fa-solid fa-arrow-right-from-bracket text-lg mb-1"></i>
                                <span className="text-[10px] font-bold uppercase tracking-wider">Logout</span>
                            </button>
                            <div className="flex flex-col items-center justify-center">
                                <div className="w-12 h-12 rounded-full bg-[#191970] flex items-center justify-center text-white shadow-lg shadow-[#191970]/30 animate-pulse">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="1" y="3" width="15" height="13" rx="2" ry="2" />
                                        <polygon points="16 8 20 8 23 11 23 16 16 16 16 8" />
                                        <circle cx="5.5" cy="18.5" r="2.5" />
                                        <circle cx="18.5" cy="18.5" r="2.5" />
                                    </svg>
                                </div>
                            </div>
                            <div className="w-24 h-full flex flex-col items-center justify-center">
                                <span className="text-sm font-black text-[#191970]">{data.active_requests.length}</span>
                                <span className="text-[10px] font-bold text-[#64748b] uppercase tracking-wider">Total Jobs</span>
                            </div>
                        </div>
                    </div>
                </React.Fragment>
            );
        };

        const JobCard = ({ req, onOrderClick, isSelected }) => {
            const isOnTheWay = req.status_raw === 'ON_THE_WAY';
            return (
                <div
                    onClick={() => onOrderClick(req)}
                    className={`glass-card rounded-[22px] p-5 cursor-pointer border ${
                        isSelected 
                        ? 'border-[#191970] ring-2 ring-[#191970]/10 bg-white' 
                        : 'border-black/5 hover:border-[#191970]/30'
                    }`}
                >
                    <div className="flex justify-between items-start mb-3">
                        <div>
                            <p className="text-[11px] font-bold text-[#64748b] uppercase tracking-wider mb-1">{req.created_at}</p>
                            <h4 className="font-extrabold text-[#191970] text-lg leading-tight">{req.volume_liters}L Water Delivery</h4>
                            <p className="text-xs text-[#64748b] flex items-center gap-1.5 mt-1.5 font-medium">
                                <i className="fa-solid fa-location-dot text-[#191970]"></i> {req.resident_address}
                            </p>
                        </div>
                        <span className={`px-2.5 py-1 rounded-lg text-[10px] font-extrabold uppercase ${
                            isOnTheWay ? 'bg-emerald-100 text-emerald-800' :
                            req.priority === 'Critical' ? 'bg-red-100 text-red-700' :
                            req.priority === 'Urgent' ? 'bg-amber-100 text-amber-800' :
                            'bg-[#191970]/10 text-[#191970]'
                        }`}>
                            {isOnTheWay ? 'On The Way' : req.priority}
                        </span>
                    </div>
                    <div className="flex justify-between items-center pt-3.5 border-t border-black/5 mt-3.5">
                        <span className="text-xs font-semibold text-[#64748b]">#{req.id.toString().padStart(4, '0')} · {req.resident_username}</span>
                        <span className="font-extrabold text-[#191970] text-md">${req.cost.toFixed(2)}</span>
                    </div>
                </div>
            );
        };

        const DetailView = ({ order, onBack, isDesktop }) => {
            const [submitting, setSubmitting] = useState(false);

            const handleAction = async (action) => {
                setSubmitting(true);
                const formData = new FormData();
                formData.append('action', action);
                formData.append('request_id', order.id);
                try {
                    await axios.post('/driver/', formData);
                    window.location.reload();
                } catch (err) {
                    alert('Action failed. Please try again.');
                    setSubmitting(false);
                }
            };

            return (
                <div className={`flex flex-col h-full bg-transparent ${isDesktop ? 'overflow-hidden' : ''}`}>
                    {/* Header */}
                    {!isDesktop && (
                        <div className="bg-gradient-to-br from-[#191970] to-[#252585] px-4 pt-12 pb-6 relative overflow-hidden rounded-b-[32px] shadow-md shrink-0">
                            <div className="absolute top-0 right-0 -mr-8 -mt-8 w-32 h-32 rounded-full bg-white opacity-10"></div>
                            <div className="flex items-center justify-between gap-3 relative z-10 w-full">
                                <div className="flex items-center gap-3">
                                    <button
                                        onClick={onBack}
                                        className="w-10 h-10 rounded-full bg-white/10 backdrop-blur-md flex items-center justify-center text-white mr-1 hover:bg-white/20 transition-all"
                                    >
                                        <i className="fa-solid fa-arrow-left"></i>
                                    </button>
                                    <div>
                                        <p className="text-white/60 text-xs font-semibold uppercase tracking-widest">Delivery Details</p>
                                        <h2 className="text-xl font-black text-white">Order #{order.id.toString().padStart(4, '0')}</h2>
                                    </div>
                                </div>
                                <div className="p-2.5 rounded-xl bg-white/15 text-white flex items-center justify-center">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="1" y="3" width="15" height="13" rx="2" ry="2" />
                                        <polygon points="16 8 20 8 23 11 23 16 16 16 16 8" />
                                        <circle cx="5.5" cy="18.5" r="2.5" />
                                        <circle cx="18.5" cy="18.5" r="2.5" />
                                    </svg>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Content */}
                    <div className={`flex-1 overflow-y-auto p-5 premium-scroll space-y-5 ${isDesktop ? 'pt-0 px-2' : ''}`}>

                        {isDesktop && (
                            <div className="border-b border-black/5 pb-4 mb-2 shrink-0 flex justify-between items-center">
                                <div>
                                    <span className="text-xs font-extrabold text-[#64748b] uppercase tracking-widest">Selected Job</span>
                                    <h2 className="text-2xl font-black text-[#191970] mt-0.5">Order #{order.id.toString().padStart(4, '0')}</h2>
                                </div>
                                <div className="p-3 rounded-2xl bg-[#191970]/5 text-[#191970] flex items-center justify-center">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" className="opacity-80">
                                        <rect x="1" y="3" width="15" height="13" rx="2" ry="2" />
                                        <polygon points="16 8 20 8 23 11 23 16 16 16 16 8" />
                                        <circle cx="5.5" cy="18.5" r="2.5" />
                                        <circle cx="18.5" cy="18.5" r="2.5" />
                                    </svg>
                                </div>
                            </div>
                        )}

                        {/* Order Summary Glass Card */}
                        <div className="bg-white/80 backdrop-blur-md rounded-3xl p-6 border border-black/5 shadow-[0_8px_30px_rgb(0,0,0,0.02)] space-y-4">
                            <h3 className="text-xs font-bold text-[#64748b] uppercase tracking-wider border-b border-black/5 pb-3">Delivery Logistics</h3>
                            <div className="space-y-4">
                                <div className="flex justify-between items-center">
                                    <span className="text-sm text-[#64748b] font-bold">Resident / Customer</span>
                                    <span className="font-extrabold text-[#191970]">{order.resident_username}</span>
                                </div>
                                <div className="flex justify-between items-start gap-4">
                                    <span className="text-sm text-[#64748b] font-bold shrink-0">Address</span>
                                    <span className="font-extrabold text-[#191970] text-right break-words max-w-xs">{order.resident_address}</span>
                                </div>
                                <div className="flex justify-between items-center">
                                    <span className="text-sm text-[#64748b] font-bold">Volume</span>
                                    <span className="font-extrabold text-[#191970] bg-[#191970]/5 px-3 py-1 rounded-xl text-sm">{order.volume_liters} Liters</span>
                                </div>
                                <div className="flex justify-between items-center">
                                    <span className="text-sm text-[#64748b] font-bold">Priority Status</span>
                                    <span className={`px-3 py-1 rounded-xl text-xs font-extrabold uppercase ${
                                        order.priority === 'Critical' ? 'bg-red-100 text-red-700' :
                                        order.priority === 'Urgent' ? 'bg-amber-100 text-amber-700' :
                                        'bg-[#191970]/10 text-[#191970]'
                                    }`}>{order.priority}</span>
                                </div>
                                <div className="flex justify-between items-center pt-3 border-t border-black/5">
                                    <span className="text-xs text-[#64748b] font-bold">Dispatch Timestamp</span>
                                    <span className="font-extrabold text-[#191970] text-xs">{order.created_at}</span>
                                </div>
                            </div>
                        </div>

                        {/* Premium Pricing Banner */}
                        <div className="bg-[#191970] rounded-3xl p-5 text-white shadow-lg relative overflow-hidden">
                            <div className="absolute top-0 right-0 -mr-6 -mt-6 w-20 h-20 rounded-full bg-white opacity-5"></div>
                            <div className="flex justify-between items-center relative z-10">
                                <div>
                                    <span className="text-white text-xs font-extrabold uppercase tracking-wider">Delivery Ledger</span>
                                    <p className="text-sm text-white/70 font-semibold mt-0.5">Order Total Billing</p>
                                </div>
                                <span className="text-3xl font-black text-white">${order.cost.toFixed(2)}</span>
                            </div>
                        </div>

                        {/* Action Buttons */}
                        <div className="pt-2 pb-6">
                            {order.status_raw === 'FORWARDED' && (
                                <button
                                    onClick={() => handleAction('claim')}
                                    disabled={submitting}
                                    className="w-full bg-[#191970] hover:bg-[#202084] text-white font-extrabold py-4 rounded-2xl text-md shadow-lg shadow-[#191970]/20 flex justify-center items-center gap-2 transition-all transform hover:-translate-y-0.5 active:translate-y-0"
                                >
                                    {submitting ? <i className="fa-solid fa-spinner animate-spin"></i> : <i className="fa-solid fa-hand-holding-hand"></i>}
                                    {submitting ? 'Claiming Logistics...' : 'Claim & Start Route'}
                                </button>
                            )}

                            {order.status_raw === 'ON_THE_WAY' && (
                                <button
                                    onClick={() => handleAction('deliver')}
                                    disabled={submitting}
                                    className="w-full bg-[#10b981] hover:bg-[#0ea270] text-white font-extrabold py-4 rounded-2xl text-md shadow-lg shadow-[#10b981]/20 flex justify-center items-center gap-2 transition-all transform hover:-translate-y-0.5 active:translate-y-0"
                                >
                                    {submitting ? <i className="fa-solid fa-spinner animate-spin"></i> : <i className="fa-solid fa-check-double"></i>}
                                    {submitting ? 'Updating Ledger...' : 'Complete Delivery'}
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(registration => {
                    console.log('ServiceWorker registered:', registration.scope);
                }).catch(error => {
                    console.log('ServiceWorker registration failed:', error);
                });
            });
        }
    </script>
</body>
</html>
