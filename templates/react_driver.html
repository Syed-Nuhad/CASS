<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Driver App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#10b981',
                        surface: '#ffffff',
                        background: '#f8fafc',
                    }
                }
            }
        }
    </script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (for JSX) -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="overflow-x-hidden antialiased">
    <!-- Initial Data passed from Django securely -->
    <script>
        window.INITIAL_DATA = {{ initial_data_json|safe }};
        window.CSRF_TOKEN = "{{ csrf_token_value }}";
        axios.defaults.headers.common['X-CSRFToken'] = window.CSRF_TOKEN;
    </script>

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const App = () => {
            const data = window.INITIAL_DATA;
            const [view, setView] = useState('list');
            const [selectedOrder, setSelectedOrder] = useState(null);

            const handleOrderClick = (order) => {
                setSelectedOrder(order);
                setView('detail');
            };

            const handleBack = () => {
                setSelectedOrder(null);
                setView('list');
            };

            return (
                <div className="flex flex-col h-screen bg-slate-50">
                    {view === 'list' && <ListView data={data} onOrderClick={handleOrderClick} />}
                    {view === 'detail' && <DetailView order={selectedOrder} onBack={handleBack} />}
                </div>
            );
        };

        const ListView = ({ data, onOrderClick }) => {
            const forwarded = data.active_requests.filter(r => r.status_raw === 'FORWARDED');
            const onTheWay = data.active_requests.filter(r => r.status_raw === 'ON_THE_WAY');

            return (
                <React.Fragment>
                    {/* Scrollable content */}
                    <div className="flex-1 overflow-y-auto pb-24 no-scrollbar">

                        {/* Hero Header Card */}
                        <div className="bg-gradient-to-br from-blue-600 to-indigo-700 px-6 pt-14 pb-8 relative overflow-hidden">
                            <div className="absolute top-0 right-0 -mr-10 -mt-10 w-40 h-40 rounded-full bg-white opacity-10"></div>
                            <div className="absolute bottom-0 left-0 -ml-10 -mb-10 w-28 h-28 rounded-full bg-white opacity-10"></div>

                            <p className="text-blue-200 text-sm font-medium mb-1 relative z-10">Driver Portal</p>
                            <h1 className="text-2xl font-bold text-white relative z-10">{data.user.username}</h1>

                            <div className="mt-5 flex gap-3 relative z-10">
                                <div className="bg-white/15 backdrop-blur-sm rounded-xl px-4 py-3 flex-1">
                                    <p className="text-blue-200 text-xs font-medium mb-0.5">Available Jobs</p>
                                    <p className="text-white font-bold text-lg">{forwarded.length}</p>
                                </div>
                                <div className="bg-white/15 backdrop-blur-sm rounded-xl px-4 py-3 flex-1">
                                    <p className="text-blue-200 text-xs font-medium mb-0.5">On The Way</p>
                                    <p className="text-white font-bold text-lg">{onTheWay.length}</p>
                                </div>
                            </div>
                        </div>

                        {/* Jobs List */}
                        <div className="px-4 pt-6">

                            {/* On The Way section */}
                            {onTheWay.length > 0 && (
                                <div className="mb-6">
                                    <div className="flex justify-between items-center mb-3 px-1">
                                        <h3 className="text-base font-bold text-slate-800">My Active Delivery</h3>
                                        <span className="text-xs font-bold bg-blue-100 text-blue-600 px-2 py-1 rounded-full">{onTheWay.length}</span>
                                    </div>
                                    <div className="space-y-3">
                                        {onTheWay.map(req => (
                                            <JobCard key={req.id} req={req} onOrderClick={onOrderClick} />
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* Available Jobs section */}
                            <div className="flex justify-between items-center mb-3 px-1">
                                <h3 className="text-base font-bold text-slate-800">Available Jobs</h3>
                                {forwarded.length > 0 && <span className="text-xs font-bold bg-amber-100 text-amber-600 px-2 py-1 rounded-full">{forwarded.length}</span>}
                            </div>

                            {forwarded.length === 0 ? (
                                <div className="bg-white rounded-2xl p-8 border border-dashed border-slate-200 text-center flex flex-col items-center justify-center mt-4">
                                    <div className="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center text-slate-300 text-2xl mb-3">
                                        <i className="fa-solid fa-map-location-dot"></i>
                                    </div>
                                    <p className="text-slate-600 font-semibold">No available jobs</p>
                                    <p className="text-xs text-slate-400 mt-1">Waiting for dispatch to forward new orders.</p>
                                </div>
                            ) : (
                                <div className="space-y-3">
                                    {forwarded.map(req => (
                                        <JobCard key={req.id} req={req} onOrderClick={onOrderClick} />
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Bottom Bar */}
                    <div className="fixed bottom-0 w-full bg-white border-t border-slate-100 shadow-[0_-4px_20px_rgba(0,0,0,0.05)] z-20">
                        <div className="flex justify-around items-center h-16">
                            <button
                                onClick={() => window.location.href='/logout/'}
                                className="flex flex-col items-center justify-center w-24 h-full text-slate-400"
                            >
                                <i className="fa-solid fa-arrow-right-from-bracket text-lg mb-1"></i>
                                <span className="text-[10px] font-medium">Logout</span>
                            </button>
                            <div className="flex flex-col items-center justify-center">
                                <div className="w-12 h-12 rounded-full bg-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/30">
                                    <i className="fa-solid fa-truck text-lg"></i>
                                </div>
                            </div>
                            <div className="w-24 h-full flex flex-col items-center justify-center">
                                <span className="text-xs font-bold text-blue-600">{data.active_requests.length}</span>
                                <span className="text-[10px] font-medium text-slate-400">Total Jobs</span>
                            </div>
                        </div>
                    </div>
                </React.Fragment>
            );
        };

        const JobCard = ({ req, onOrderClick }) => {
            const isOnTheWay = req.status_raw === 'ON_THE_WAY';
            return (
                <div
                    onClick={() => onOrderClick(req)}
                    className="bg-white rounded-xl p-5 shadow-sm border border-slate-100 cursor-pointer"
                >
                    <div className="flex justify-between items-start mb-3">
                        <div>
                            <p className="text-xs font-bold text-slate-400 mb-1">{req.created_at}</p>
                            <h4 className="font-bold text-slate-800 text-lg">{req.volume_liters}L Delivery</h4>
                            <p className="text-[11px] text-slate-500 flex items-center gap-1 mt-1">
                                <i className="fa-solid fa-location-dot text-slate-400"></i> {req.resident_address}
                            </p>
                        </div>
                        <span className={`px-2.5 py-1 rounded-md text-xs font-bold ${
                            isOnTheWay ? 'bg-blue-100 text-blue-700' :
                            req.priority === 'Critical' ? 'bg-red-100 text-red-700' :
                            req.priority === 'Urgent' ? 'bg-amber-100 text-amber-700' :
                            'bg-amber-100 text-amber-700'
                        }`}>
                            {isOnTheWay ? req.status : req.priority}
                        </span>
                    </div>
                    <div className="flex justify-between items-center pt-3 border-t border-slate-100 mt-2">
                        <span className="text-sm font-medium text-slate-500">#{req.id.toString().padStart(4, '0')} · {req.resident_username}</span>
                        <span className="font-bold text-slate-800">${req.cost.toFixed(2)}</span>
                    </div>
                </div>
            );
        };

        const DetailView = ({ order, onBack }) => {
            const [submitting, setSubmitting] = useState(false);

            const handleAction = async (action) => {
                setSubmitting(true);
                const formData = new FormData();
                formData.append('action', action);
                formData.append('request_id', order.id);
                try {
                    await axios.post('/driver/', formData);
                    window.location.reload();
                } catch (err) {
                    alert('Action failed. Please try again.');
                    setSubmitting(false);
                }
            };

            return (
                <div className="flex flex-col h-full bg-slate-50">
                    {/* Header */}
                    <div className="bg-gradient-to-br from-blue-600 to-indigo-700 px-4 pt-14 pb-6 relative overflow-hidden">
                        <div className="absolute top-0 right-0 -mr-8 -mt-8 w-32 h-32 rounded-full bg-white opacity-10"></div>
                        <div className="flex items-center gap-3 relative z-10">
                            <button
                                onClick={onBack}
                                className="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center text-white mr-1"
                            >
                                <i className="fa-solid fa-arrow-left"></i>
                            </button>
                            <div>
                                <p className="text-blue-200 text-xs font-medium">Job Details</p>
                                <h2 className="text-lg font-bold text-white">Order #{order.id.toString().padStart(4, '0')}</h2>
                            </div>
                        </div>
                    </div>

                    {/* Content */}
                    <div className="flex-1 overflow-y-auto p-5 no-scrollbar space-y-4">

                        {/* Truck Icon */}
                        <div className="flex items-center justify-center py-4">
                            <div className="w-20 h-20 rounded-full bg-blue-50 border-4 border-white shadow-lg flex items-center justify-center text-blue-500 text-3xl">
                                <i className="fa-solid fa-truck"></i>
                            </div>
                        </div>

                        {/* Order Summary Card */}
                        <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                            <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Order Summary</h3>
                            <div className="space-y-4">
                                <div className="flex justify-between items-center">
                                    <span className="text-slate-500 font-medium">Resident</span>
                                    <span className="font-bold text-slate-800">{order.resident_username}</span>
                                </div>
                                <div className="flex justify-between items-start gap-4">
                                    <span className="text-slate-500 font-medium shrink-0">Address</span>
                                    <span className="font-bold text-slate-800 text-right break-words">{order.resident_address}</span>
                                </div>
                                <div className="flex justify-between items-center">
                                    <span className="text-slate-500 font-medium">Volume</span>
                                    <span className="font-bold text-blue-600">{order.volume_liters} Liters</span>
                                </div>
                                <div className="flex justify-between items-center">
                                    <span className="text-slate-500 font-medium">Priority</span>
                                    <span className={`px-2.5 py-1 rounded-md text-[10px] font-bold uppercase ${
                                        order.priority === 'Critical' ? 'bg-red-100 text-red-700' :
                                        order.priority === 'Urgent' ? 'bg-amber-100 text-amber-700' :
                                        'bg-slate-100 text-slate-600'
                                    }`}>{order.priority}</span>
                                </div>
                                <div className="flex justify-between items-center pt-3 border-t border-slate-50">
                                    <span className="text-slate-500 font-medium">Time</span>
                                    <span className="font-medium text-slate-600 text-sm">{order.created_at}</span>
                                </div>
                            </div>
                        </div>

                        {/* Billing Card */}
                        <div className="bg-slate-800 rounded-2xl p-5 text-white">
                            <div className="flex justify-between items-center">
                                <span className="text-slate-300 font-medium">Order Total</span>
                                <span className="text-2xl font-bold">${order.cost.toFixed(2)}</span>
                            </div>
                        </div>

                        {/* Action Button */}
                        <div className="pt-2 pb-6">
                            {order.status_raw === 'FORWARDED' && (
                                <button
                                    onClick={() => handleAction('claim')}
                                    disabled={submitting}
                                    className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl text-lg shadow-lg shadow-blue-500/30 flex justify-center items-center gap-2"
                                >
                                    {submitting ? <i className="fa-solid fa-spinner animate-spin"></i> : <i className="fa-solid fa-hand-holding-hand"></i>}
                                    {submitting ? 'Claiming...' : 'Claim Job'}
                                </button>
                            )}

                            {order.status_raw === 'ON_THE_WAY' && (
                                <button
                                    onClick={() => handleAction('deliver')}
                                    disabled={submitting}
                                    className="w-full bg-emerald-500 text-white font-bold py-4 rounded-xl text-lg shadow-lg shadow-emerald-500/30 flex justify-center items-center gap-2"
                                >
                                    {submitting ? <i className="fa-solid fa-spinner animate-spin"></i> : <i className="fa-solid fa-check-double"></i>}
                                    {submitting ? 'Confirming...' : 'Mark Delivered'}
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').then(registration => {
                    console.log('ServiceWorker registered:', registration.scope);
                }).catch(error => {
                    console.log('ServiceWorker registration failed:', error);
                });
            });
        }
    </script>
</body>
</html>
