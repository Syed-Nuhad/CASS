<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CASS Resident Dashboard</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#191970',       // Navy / Midnight Blue
                        accent: '#38bdf8',        // Sky Blue
                        surface: 'rgba(255, 255, 255, 0.85)',
                        'brand-bg': '#ECEFF1',
                    },
                    borderRadius: {
                        '3xl': '24px',
                    }
                }
            }
        }
    </script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (for JSX) -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <!-- Phosphor Icons for Thin Line Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="{% static 'css/react_resident.css' %}">
</head>
<body class="overflow-x-hidden antialiased text-[#0D0907]">
    <!-- Initial Data passed securely from Django -->
    <script>
        window.INITIAL_DATA = {{ initial_data_json|safe }};
        window.CSRF_TOKEN = "{{ csrf_token_value }}";
        axios.defaults.headers.common['X-CSRFToken'] = window.CSRF_TOKEN;
    </script>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const App = () => {
            const data = window.INITIAL_DATA;
            const [activeTab, setActiveTab] = useState('home'); // 'home', 'order', 'history', 'notifications'
            const [width, setWidth] = useState(window.innerWidth);
            const [showNotifDropdown, setShowNotifDropdown] = useState(false);
            const [unreadCount, setUnreadCount] = useState(data.unread_count || 0);
            const [notifications, setNotifications] = useState(data.notifications || []);

            // Track window resize for responsiveness
            useEffect(() => {
                const handleResize = () => setWidth(window.innerWidth);
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const isDesktop = width >= 1024;

            // Handle read notifications
            const handleReadNotifications = async () => {
                if (unreadCount > 0) {
                    try {
                        await axios.post('/api/notifications/read/');
                        setUnreadCount(0);
                        setNotifications(prev => prev.map(n => ({ ...n, is_read: true })));
                    } catch (err) {
                        console.error('Failed to mark notifications as read', err);
                    }
                }
            };

            const toggleNotifDropdown = (e) => {
                e.stopPropagation();
                setShowNotifDropdown(!showNotifDropdown);
                if (!showNotifDropdown) {
                    handleReadNotifications();
                }
            };

            useEffect(() => {
                const closeDropdown = () => setShowNotifDropdown(false);
                document.addEventListener('click', closeDropdown);
                return () => document.removeEventListener('click', closeDropdown);
            }, []);

            const activeRequests = useMemo(() => {
                return data.requests.filter(r => r.status_raw !== 'DELIVERED' && r.status_raw !== 'CANCELLED');
            }, [data.requests]);

            const pastRequests = useMemo(() => {
                return data.requests.filter(r => r.status_raw === 'DELIVERED' || r.status_raw === 'CANCELLED');
            }, [data.requests]);

            if (isDesktop) {
                // PREMIUM DUAL COLUMN DESKTOP VIEW
                return (
                    <div className="flex h-screen overflow-hidden p-6 gap-6 max-w-7xl mx-auto">
                        
                        {/* LEFT COLUMN: Profile, Balance & Live Deliveries */}
                        <div className="w-[420px] shrink-0 flex flex-col glass-card rounded-[32px] p-6 overflow-hidden">
                            {/* Brand Header */}
                            <div className="flex items-center gap-4 mb-6 border-b border-black/5 pb-5">
                                <img src={data.user.logo_url} alt="CASS Logo" className="h-12 w-12 object-contain" />
                                <div>
                                    <h1 className="text-xl font-extrabold text-[#191970] leading-tight">CASS Portal</h1>
                                    <p className="text-xs font-semibold text-[#64748b] tracking-wider uppercase">Resident Services</p>
                                </div>
                            </div>

                            {/* User & Notifications Bell */}
                            <div className="flex items-center justify-between bg-[#191970]/5 p-4 rounded-2xl mb-6">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 rounded-full bg-[#191970] text-white flex items-center justify-center font-bold text-lg">
                                        {data.user.username[0].toUpperCase()}
                                    </div>
                                    <div>
                                        <p className="text-xs text-[#64748b] font-medium">Welcome back,</p>
                                        <h4 className="font-bold text-[#191970]">{data.user.username}</h4>
                                    </div>
                                </div>

                                <div className="flex gap-2">
                                    {/* Bell Icon with Dropdown */}
                                    <div className="relative">
                                        <button 
                                            onClick={toggleNotifDropdown}
                                            className="p-2.5 rounded-xl bg-white hover:bg-slate-50 text-[#191970] border border-black/5 transition-all relative"
                                        >
                                            <i className="ph-light ph-bell text-lg"></i>
                                            {unreadCount > 0 && (
                                                <span className="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full ring-2 ring-white"></span>
                                            )}
                                        </button>

                                        {/* Dropdown Box */}
                                        {showNotifDropdown && (
                                            <div className="absolute right-0 mt-3 w-80 bg-white border border-black/5 rounded-2xl shadow-xl z-50 p-4 max-h-[350px] overflow-y-auto premium-scroll animate-fade-in" onClick={e => e.stopPropagation()}>
                                                <h4 className="font-bold text-sm text-[#191970] border-b border-black/5 pb-2 mb-2 flex justify-between">
                                                    <span>Notifications</span>
                                                    {unreadCount > 0 && <span className="text-[10px] bg-red-100 text-red-600 px-2 py-0.5 rounded-full font-bold">New</span>}
                                                </h4>
                                                {notifications.length === 0 ? (
                                                    <p className="text-xs text-[#64748b] py-6 text-center">No notifications yet.</p>
                                                ) : (
                                                    <div className="space-y-3">
                                                        {notifications.map(n => (
                                                            <div key={n.id} className={`p-2.5 rounded-xl text-xs transition-colors ${n.is_read ? 'bg-transparent' : 'bg-blue-50/50'}`}>
                                                                <p className="font-bold text-[#191970]">{n.title}</p>
                                                                <p className="text-[#64748b] mt-0.5 leading-relaxed">{n.message}</p>
                                                                <span className="text-[9px] text-slate-400 mt-1 block">{n.created_at}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>

                                    {/* Logout */}
                                    <button 
                                        onClick={() => window.location.href='/logout/'}
                                        className="p-2.5 rounded-xl bg-white hover:bg-red-50 text-[#64748b] hover:text-red-500 border border-black/5 transition-all"
                                        title="Logout"
                                    >
                                        <i className="ph-light ph-sign-out text-lg"></i>
                                    </button>
                                </div>
                            </div>



                            {/* Active Deliveries List (Scrollable) */}
                            <div className="flex-1 flex flex-col min-h-0">
                                <h3 className="text-xs font-bold text-[#191970] uppercase tracking-wider mb-3 flex items-center gap-2">
                                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                                    Active Orders
                                </h3>
                                <div className="flex-1 overflow-y-auto premium-scroll pr-1 space-y-3">
                                    {activeRequests.length === 0 ? (
                                        <div className="bg-black/5 rounded-2xl p-6 text-center border border-dashed border-black/10">
                                            <i className="ph-light ph-check-circle text-2xl text-[#10b981] mb-2"></i>
                                            <p className="text-xs font-semibold text-[#191970]">No active requests</p>
                                            <p className="text-[10px] text-[#64748b] mt-0.5">Need water? Create a request on the right panel.</p>
                                        </div>
                                    ) : (
                                        activeRequests.map(req => (
                                            <ActiveRequestCard key={req.id} req={req} />
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* RIGHT COLUMN: Interactive Tabs (Order Form / History) */}
                        <div className="flex-1 flex flex-col glass-card rounded-[32px] p-8 overflow-hidden">
                            {/* Tab Selection */}
                            <div className="flex border-b border-black/5 pb-4 mb-6 shrink-0">
                                <button 
                                    onClick={() => setActiveTab('order')}
                                    className={`px-6 py-2.5 rounded-xl font-bold text-sm transition-all flex items-center gap-2 ${
                                        activeTab === 'order' || activeTab === 'home'
                                        ? 'bg-[#191970] text-white shadow-md' 
                                        : 'text-[#64748b] hover:text-[#191970] hover:bg-black/5'
                                    }`}
                                >
                                    <i className="ph-light ph-drop"></i>
                                    Request Water
                                </button>
                                <button 
                                    onClick={() => setActiveTab('history')}
                                    className={`ml-3 px-6 py-2.5 rounded-xl font-bold text-sm transition-all flex items-center gap-2 ${
                                        activeTab === 'history' 
                                        ? 'bg-[#191970] text-white shadow-md' 
                                        : 'text-[#64748b] hover:text-[#191970] hover:bg-black/5'
                                    }`}
                                >
                                    <i className="ph-light ph-clock-counter-clockwise"></i>
                                    Order History ({pastRequests.length})
                                </button>
                            </div>

                            {/* View Contents */}
                            <div className="flex-1 overflow-y-auto premium-scroll pr-1">
                                {(activeTab === 'order' || activeTab === 'home') && (
                                    <OrderFormView pricing={data.pricing} />
                                )}
                                {activeTab === 'history' && (
                                    <HistoryView requests={pastRequests} />
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            // SLEEK MOBILE VIEW (with bottom navigation)
            return (
                <div className="flex flex-col h-screen bg-transparent">
                    {/* Header */}
                    <div className="bg-white/80 backdrop-blur-md px-6 pt-12 pb-6 relative overflow-hidden rounded-b-[32px] border-b border-black/5 shadow-[0_8px_30px_rgba(25,25,112,0.02)] shrink-0">
                        <div className="flex justify-between items-center relative z-10">
                            <div className="flex items-center gap-3">
                                <img src={data.user.logo_url} alt="CASS Logo" className="h-9 w-9 object-contain" />
                                <div>
                                    <p className="text-[#191970]/60 text-[10px] font-bold tracking-widest uppercase">CASS Resident</p>
                                    <h1 className="text-xl font-black text-[#191970]">Hi, {data.user.username}</h1>
                                </div>
                            </div>
                            
                            <div className="flex gap-2">
                                {/* Bell */}
                                <div className="relative">
                                    <button 
                                        onClick={toggleNotifDropdown}
                                        className="p-2.5 rounded-xl bg-[#191970]/5 text-[#191970] transition-all relative"
                                    >
                                        <i className="ph-light ph-bell text-lg"></i>
                                        {unreadCount > 0 && (
                                            <span className="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full"></span>
                                        )}
                                    </button>

                                    {/* Dropdown */}
                                    {showNotifDropdown && (
                                        <div className="absolute right-0 mt-3 w-72 bg-white border border-black/5 rounded-2xl shadow-xl z-50 p-4 max-h-[300px] overflow-y-auto premium-scroll animate-fade-in" onClick={e => e.stopPropagation()}>
                                            <h4 className="font-bold text-xs text-[#191970] border-b border-black/5 pb-2 mb-2">Notifications</h4>
                                            {notifications.length === 0 ? (
                                                <p className="text-[11px] text-[#64748b] py-4 text-center">No notifications yet.</p>
                                            ) : (
                                                <div className="space-y-2.5">
                                                    {notifications.map(n => (
                                                        <div key={n.id} className="p-2 bg-slate-50 rounded-lg text-[11px]">
                                                            <p className="font-bold text-[#191970]">{n.title}</p>
                                                            <p className="text-[#64748b] mt-0.5">{n.message}</p>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>

                                {/* Logout */}
                                <button 
                                    onClick={() => window.location.href='/logout/'}
                                    className="p-2.5 rounded-xl bg-[#64748b]/10 text-[#64748b] transition-all"
                                >
                                    <i className="ph-light ph-sign-out text-lg"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Scrollable Main Area */}
                    <div className="flex-1 overflow-y-auto pb-24 px-4 pt-6 no-scrollbar">
                        {activeTab === 'home' && (
                            <div className="space-y-6 animate-fade-in">


                                {/* Active Deliveries Section */}
                                <div>
                                    <h3 className="text-sm font-black text-[#191970] uppercase tracking-wider mb-3 px-1">Active Deliveries</h3>
                                    {activeRequests.length === 0 ? (
                                        <div className="bg-white/80 backdrop-blur-md rounded-2xl p-6 border border-black/5 text-center flex flex-col items-center justify-center">
                                            <div className="w-12 h-12 bg-slate-100 rounded-full flex items-center justify-center text-slate-300 text-xl mb-2">
                                                <i className="ph-light ph-drop"></i>
                                            </div>
                                            <p className="text-slate-500 font-semibold text-xs">No active deliveries</p>
                                            <button onClick={() => setActiveTab('order')} className="mt-2 text-xs font-bold text-[#191970] hover:underline">Request now</button>
                                        </div>
                                    ) : (
                                        <div className="space-y-3">
                                            {activeRequests.map(req => (
                                                <ActiveRequestCard key={req.id} req={req} />
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {activeTab === 'order' && (
                            <div className="animate-fade-in pb-10">
                                <OrderFormView pricing={data.pricing} />
                            </div>
                        )}

                        {activeTab === 'history' && (
                            <div className="animate-fade-in pb-10">
                                <h3 className="text-sm font-black text-[#64748b] uppercase tracking-wider mb-4 px-1">Order History</h3>
                                <HistoryView requests={pastRequests} />
                            </div>
                        )}
                    </div>

                    {/* Bottom Mobile Tab Bar */}
                    <div className="fixed bottom-0 w-full bg-white/95 backdrop-blur-md border-t border-black/5 shadow-[0_-4px_25px_rgba(25,25,112,0.06)] z-20 pb-safe">
                        <div className="flex justify-around items-center h-16">
                            <button 
                                onClick={() => setActiveTab('home')}
                                className={`flex flex-col items-center justify-center w-20 h-full transition-colors ${activeTab === 'home' ? 'text-[#191970]' : 'text-slate-400'}`}
                            >
                                <i className="ph-light ph-house text-lg mb-1"></i>
                                <span className="text-[10px] font-bold uppercase tracking-wider">Home</span>
                            </button>
                            
                            {/* Central CTA droplet button */}
                            <div className="relative -top-5">
                                <button 
                                    onClick={() => setActiveTab('order')}
                                    className={`w-14 h-14 rounded-full flex items-center justify-center text-white shadow-lg transition-transform ${activeTab === 'order' ? 'bg-[#38bdf8] scale-110' : 'bg-[#191970]'}`}
                                >
                                    <i className="ph-light ph-drop text-xl"></i>
                                </button>
                            </div>
                            
                            <button 
                                onClick={() => setActiveTab('history')}
                                className={`flex flex-col items-center justify-center w-20 h-full transition-colors ${activeTab === 'history' ? 'text-[#191970]' : 'text-slate-400'}`}
                            >
                                <i className="ph-light ph-clock-counter-clockwise text-lg mb-1"></i>
                                <span className="text-[10px] font-bold uppercase tracking-wider">History</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // SUB-COMPONENT: Active Request Card
        const ActiveRequestCard = ({ req }) => {
            const isDelivering = req.status_raw === 'ON_THE_WAY';
            const isForwarded = req.status_raw === 'FORWARDED';
            return (
                <div className="bg-white/95 backdrop-blur-md rounded-2xl p-4 border border-black/5 flex items-center justify-between shadow-sm">
                    <div className="flex items-center gap-3">
                        <div className="w-10 h-10 rounded-full bg-[#191970]/5 text-[#191970] flex items-center justify-center text-lg">
                            <i className="ph-light ph-truck text-xl"></i>
                        </div>
                        <div>
                            <p className="font-bold text-sm text-[#191970]">{req.volume_liters}L Delivery</p>
                            <div className="flex items-center gap-1.5 mt-0.5">
                                <span className={`w-1.5 h-1.5 rounded-full ${isDelivering ? 'bg-emerald-500 animate-pulse' : isForwarded ? 'bg-[#38bdf8]' : 'bg-amber-500 animate-pulse'}`}></span>
                                <span className="text-[11px] font-bold text-slate-500 uppercase">{req.status}</span>
                            </div>
                        </div>
                    </div>
                    <div className="text-right">
                        <p className="text-sm font-extrabold text-[#191970]">${req.cost.toFixed(2)}</p>
                        <span className="text-[9px] font-bold text-slate-400 uppercase">{req.priority}</span>
                    </div>
                </div>
            );
        };

        // SUB-COMPONENT: Order Form View
        const OrderFormView = ({ pricing }) => {
            const [volume, setVolume] = useState(1000);
            const [priority, setPriority] = useState('NORMAL');
            const [note, setNote] = useState('');
            const [photoFile, setPhotoFile] = useState(null);
            const [submitting, setSubmitting] = useState(false);

            // Compute Estimated Pricing
            const costCalc = useMemo(() => {
                const volNum = Number(volume) || 0;
                let cost = (volNum * pricing.price_per_liter) + pricing.delivery_fee;
                if (priority === 'URGENT') cost += pricing.urgent_surcharge;
                if (priority === 'CRITICAL') cost += pricing.critical_surcharge;
                return cost;
            }, [volume, priority, pricing]);


            const handleFileChange = (e) => {
                if (e.target.files && e.target.files[0]) {
                    setPhotoFile(e.target.files[0]);
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setSubmitting(true);

                // Build multipart/form-data for Axios
                const formData = new FormData();
                formData.append('volume', volume); // Needs to match Django request.POST.get('volume')
                formData.append('priority', priority);
                formData.append('note', note);
                if (photoFile) {
                    formData.append('photo', photoFile);
                }

                try {
                    await axios.post('/app/', formData, {
                        headers: {
                            'Content-Type': 'multipart/form-data'
                        }
                    });
                    window.location.reload();
                } catch (err) {
                    alert('Logistics dispatch failed. Please check network and try again.');
                    setSubmitting(false);
                }
            };

            return (
                <div className="space-y-6">
                    <div>
                        <h2 className="text-2xl font-black text-[#191970]">Request Water Delivery</h2>
                        <p className="text-xs text-[#64748b] mt-1 font-medium">Configure volume & emergency priority levels. Payment is collected in cash by the driver upon delivery.</p>
                    </div>

                    <form onSubmit={handleSubmit} className="space-y-5">
                        
                        {/* Volume Selection Card */}
                        <div className="bg-white/85 rounded-3xl p-5 border border-black/5 shadow-sm space-y-4">
                            <label className="block text-xs font-bold text-[#191970] uppercase tracking-wider">Volume required (Liters)</label>
                            
                            <div className="flex justify-between items-center py-2">
                                <button 
                                    type="button" 
                                    onClick={() => setVolume(Math.max(1, (Number(volume) || 1000) - 100))} 
                                    className="w-12 h-12 rounded-2xl bg-[#191970]/5 hover:bg-[#191970]/10 text-[#191970] flex items-center justify-center text-lg transition-all"
                                >
                                    <i className="ph-light ph-minus"></i>
                                </button>
                                
                                <div className="text-center flex items-center justify-center">
                                    <input 
                                        type="number"
                                        value={volume}
                                        onChange={e => {
                                            const val = e.target.value;
                                            setVolume(val === '' ? '' : Number(val));
                                        }}
                                        onBlur={() => {
                                            if (volume === '' || volume < 1) setVolume(100);
                                            // Removed arbitrary max limit of 5000 so resident can type any amount
                                        }}
                                        min="1"
                                        className="text-4xl font-black text-[#191970] bg-transparent border-b-2 border-transparent hover:border-[#191970]/20 focus:border-[#191970] focus:outline-none w-32 text-center [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none font-sans"
                                    />
                                    <span className="text-lg font-bold text-[#64748b] ml-1">L</span>
                                </div>
                                
                                <button 
                                    type="button" 
                                    onClick={() => setVolume((Number(volume) || 1000) + 100)} 
                                    className="w-12 h-12 rounded-2xl bg-[#191970]/5 hover:bg-[#191970]/10 text-[#191970] flex items-center justify-center text-lg transition-all"
                                >
                                    <i className="ph-light ph-plus"></i>
                                </button>
                            </div>

                            {/* Preset Buttons */}
                            <div className="grid grid-cols-4 gap-2 pt-2 border-t border-black/5">
                                {[500, 1000, 2000, 3000].map(v => (
                                    <button
                                        key={v}
                                        type="button"
                                        onClick={() => setVolume(v)}
                                        className={`py-2 rounded-xl text-xs font-bold transition-all ${
                                            volume === v 
                                            ? 'bg-[#191970] text-white' 
                                            : 'bg-black/5 text-[#64748b] hover:bg-black/10'
                                        }`}
                                    >
                                        {v}L
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* Priority Selector */}
                        <div className="bg-white/85 rounded-3xl p-5 border border-black/5 shadow-sm space-y-3">
                            <label className="block text-xs font-bold text-[#191970] uppercase tracking-wider">Priority / emergency level</label>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                
                                {/* Normal */}
                                <div 
                                    onClick={() => setPriority('NORMAL')}
                                    className={`cursor-pointer rounded-2xl p-4 border-2 transition-all flex md:flex-col justify-between items-center ${
                                        priority === 'NORMAL' 
                                        ? 'border-[#191970] bg-[#191970]/5' 
                                        : 'border-black/5 hover:border-black/10 bg-transparent'
                                    }`}
                                >
                                    <div className="text-left md:text-center">
                                        <p className="font-bold text-sm text-[#191970]">Normal</p>
                                        <p className="text-[10px] text-slate-500 mt-0.5">Within 48 hours</p>
                                    </div>
                                    <span className="text-xs font-extrabold text-[#191970] mt-0 md:mt-2">Free Delivery</span>
                                </div>

                                {/* Urgent */}
                                <div 
                                    onClick={() => setPriority('URGENT')}
                                    className={`cursor-pointer rounded-2xl p-4 border-2 transition-all flex md:flex-col justify-between items-center ${
                                        priority === 'URGENT' 
                                        ? 'border-amber-500 bg-amber-50' 
                                        : 'border-black/5 hover:border-black/10 bg-transparent'
                                    }`}
                                >
                                    <div className="text-left md:text-center">
                                        <p className="font-bold text-sm text-amber-700">Urgent</p>
                                        <p className="text-[10px] text-slate-500 mt-0.5">Within 24 hours</p>
                                    </div>
                                    <span className="text-xs font-extrabold text-amber-600 mt-0 md:mt-2">+${pricing.urgent_surcharge}</span>
                                </div>

                                {/* Critical */}
                                <div 
                                    onClick={() => setPriority('CRITICAL')}
                                    className={`cursor-pointer rounded-2xl p-4 border-2 transition-all flex md:flex-col justify-between items-center ${
                                        priority === 'CRITICAL' 
                                        ? 'border-red-500 bg-red-50' 
                                        : 'border-black/5 hover:border-black/10 bg-transparent'
                                    }`}
                                >
                                    <div className="text-left md:text-center">
                                        <p className="font-bold text-sm text-red-700">Critical</p>
                                        <p className="text-[10px] text-slate-500 mt-0.5">Emergency/ASAP</p>
                                    </div>
                                    <span className="text-xs font-extrabold text-red-600 mt-0 md:mt-2">+${pricing.critical_surcharge}</span>
                                </div>

                            </div>
                        </div>

                        {/* Optional Info Box */}
                        <div className="bg-white/85 rounded-3xl p-5 border border-black/5 shadow-sm space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-[#191970] uppercase tracking-wider mb-2">Driver Instructions (Optional)</label>
                                <textarea
                                    value={note}
                                    onChange={e => setNote(e.target.value)}
                                    placeholder="Add codes, property entry info, or location notes..."
                                    rows="2"
                                    className="w-full bg-slate-100 border border-black/5 rounded-2xl p-3 text-sm focus:outline-none focus:border-[#191970]"
                                />
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-[#191970] uppercase tracking-wider mb-2">Optional Photo (Water tank reference)</label>
                                <input
                                    type="file"
                                    accept="image/*"
                                    onChange={handleFileChange}
                                    className="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-[#191970]/5 file:text-[#191970] hover:file:bg-[#191970]/10"
                                />
                            </div>
                        </div>

                        {/* Financial Ledger Breakdown & submit */}
                        <div className="bg-[#191970] rounded-3xl p-6 text-white shadow-xl space-y-4 relative overflow-hidden">
                            <div className="absolute top-0 right-0 -mr-6 -mt-6 w-20 h-20 rounded-full bg-white opacity-[0.03]"></div>
                            <div className="flex justify-between items-center">
                                <div>
                                    <span className="text-white/60 text-xs font-bold uppercase tracking-wider">Estimated Total</span>
                                    <p className="text-xs text-white/50 mt-0.5 font-medium">Includes delivery & priority surcharges</p>
                                </div>
                                <span className="text-3xl font-black text-[#38bdf8]">${costCalc.toFixed(2)}</span>
                            </div>
                            
                            <button
                                type="submit"
                                disabled={submitting}
                                className="w-full bg-[#38bdf8] hover:bg-[#0ea5e9] text-[#191970] font-extrabold py-4 rounded-2xl shadow-md transition-all flex justify-center items-center gap-2 transform active:scale-[0.98]"
                            >
                                {submitting ? <i className="ph-light ph-spinner animate-spin"></i> : <i className="ph-light ph-paper-plane-right"></i>}
                                {submitting ? 'Placing Request...' : 'Dispatch Water Order'}
                            </button>
                        </div>
                    </form>
                </div>
            );
        };

        // SUB-COMPONENT: History View
        const HistoryView = ({ requests }) => {
            if (requests.length === 0) {
                return (
                    <div className="text-center py-12 bg-white/70 backdrop-blur-md rounded-3xl border border-black/5 p-8">
                        <div className="w-14 h-14 bg-slate-50 rounded-full flex items-center justify-center text-slate-300 text-xl mx-auto mb-3">
                            <i className="ph-light ph-clock-counter-clockwise"></i>
                        </div>
                        <p className="font-bold text-[#191970] text-sm">No completed requests</p>
                        <p className="text-xs text-[#64748b] mt-1">Once you receive deliveries, they will list here as billing invoices.</p>
                    </div>
                );
            }

            return (
                <div className="space-y-4">
                    {requests.map(req => {
                        const isDelivered = req.status_raw === 'DELIVERED';
                        return (
                            <div key={req.id} className="bg-white/95 backdrop-blur-md rounded-2xl p-5 border border-black/5 shadow-sm space-y-3">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <p className="text-[10px] font-bold text-slate-400 uppercase">{req.created_at}</p>
                                        <h4 className="font-extrabold text-sm text-[#191970] mt-0.5">{req.volume_liters}L Water Delivery</h4>
                                    </div>
                                    <span className={`px-2.5 py-0.5 rounded-lg text-[9px] font-extrabold uppercase ${
                                        isDelivered ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'
                                    }`}>
                                        {req.status}
                                    </span>
                                </div>
                                <div className="flex justify-between items-center pt-3 border-t border-black/5 text-xs">
                                    <span className="font-semibold text-slate-400">Order ID: #{req.id.toString().padStart(4, '0')}</span>
                                    <span className="font-black text-[#191970]">${req.cost.toFixed(2)}</span>
                                </div>
                            </div>
                        );
                    })}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
